<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Output 1 — Media</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body{ height:100%; background:#0c0e10; overflow:hidden; }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0c0e10; }
  #stage iframe{ width:100%; height:100%; border:0; display:block; }
  #stage video{ width:100%; height:100%; object-fit:contain; background:#000; }

  #pdf-canvas-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #pdf-canvas-wrap canvas{
    max-width:100%; max-height:100%;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    opacity:0; transition:opacity .5s ease;
  }
  #pdf-canvas-wrap canvas.in{ opacity:1; }

  #page-dots{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:7px; z-index:10;
  }
  #page-dots .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--text-faint); transition:background .2s ease, transform .2s ease;
  }
  #page-dots .dot.active{ background:var(--live); transform:scale(1.3); }

  #empty{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    color:var(--text-faint);
  }
  #empty h1{
    font-family:var(--font-display); font-weight:600; font-size:15px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); margin:0;
  }
  #empty p{ margin:0; font-size:12.5px; font-family:var(--font-mono); }

  #hud{
    position:fixed; top:16px; left:16px;
    display:flex; align-items:center; gap:8px;
    background:rgba(20,23,26,.75);
    border:1px solid var(--line);
    border-radius:100px;
    padding:6px 12px 6px 10px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    color:var(--text-dim);
    transition:opacity .6s ease;
    backdrop-filter:blur(6px);
    z-index:10;
  }
  #hud.faded{ opacity:0; }

  #fs-btn{
    position:fixed; bottom:16px; right:16px;
    background:rgba(20,23,26,.75);
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:100px;
    padding:8px 14px;
    font-family:var(--font-mono); font-size:11px;
    transition:opacity .6s ease;
    z-index:10;
    backdrop-filter:blur(6px);
  }
  #fs-btn.faded{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

  <div id="hud"><span class="tally is-standby" id="tally"></span> <span id="hud-label">CH.01 MEDIA</span></div>
  <button id="fs-btn">Fullscreen ⤢</button>

  <div id="stage">
    <div id="pdf-canvas-wrap"></div>
  </div>
  <div id="page-dots"></div>

  <div id="empty">
    <span class="tally is-standby"></span>
    <h1>Output 1 · Media</h1>
    <p>Waiting for a PDF or video from the admin console…</p>
  </div>

<script src="js/protocol-check.js"></script>
<script src="js/store.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/display-media.js"></script>
</body>
</html>
