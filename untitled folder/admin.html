<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signage Console — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{ padding:0 0 60px; }

  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand a{ text-decoration:none; }
  .brand h1{
    font-family:var(--font-display); font-size:16px; font-weight:600;
    letter-spacing:.03em; text-transform:uppercase; margin:0;
  }
  .brand h1 span{ color:var(--live); }
  .status-strip{ display:flex; gap:18px; }
  .status-chip{
    display:flex; align-items:center; gap:7px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    color:var(--text-dim); text-transform:uppercase;
  }

  main{
    max-width:1180px; margin:0 auto; padding:28px;
    display:grid; grid-template-columns:1fr 1fr; gap:20px;
  }
  @media (max-width:920px){ main{ grid-template-columns:1fr; } }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .panel-head{
    padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .panel-head .chan{ display:flex; align-items:center; gap:10px; }
  .panel-head .chan .num{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); letter-spacing:.1em; }
  .panel-head h2{ font-family:var(--font-display); font-size:17px; font-weight:600; margin:0; letter-spacing:.01em; }
  .panel-body{ padding:20px; display:flex; flex-direction:column; gap:16px; }

  /* ---- Output 1: document dropzone ---- */
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:26px 18px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    transition:border-color .15s ease, background .15s ease;
    cursor:pointer;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--live);
    background:color-mix(in srgb, var(--live) 6%, transparent);
  }
  .dropzone strong{ color:var(--text); display:block; font-size:14px; margin-bottom:4px; }
  .dropzone input{ display:none; }

  .file-row{
    display:flex; align-items:center; gap:12px;
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .file-row .icn{
    width:34px; height:34px; border-radius:6px; flex:none;
    background:var(--live-dim); color:var(--live);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:10px; font-weight:700;
  }
  .file-row .meta{ min-width:0; flex:1; }
  .file-row .name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-row .sub{ font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); }
  .file-row.empty .icn{ background:var(--panel); color:var(--text-faint); }
  .file-row.empty .name{ color:var(--text-faint); font-weight:500; }

  .preview-frame{
    width:100%; aspect-ratio:16/10;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:#0c0e10;
    overflow:hidden;
  }
  .preview-frame iframe{ width:100%; height:100%; border:0; }
  .preview-empty{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:12px; font-family:var(--font-mono);
  }

  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }

  /* ---- Output 2: message editor ---- */
  textarea{
    width:100%; min-height:180px; resize:vertical;
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px; line-height:1.5;
    padding:14px;
  }
  textarea::placeholder{ color:var(--text-faint); }

  .controls-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .seg{
    display:inline-flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  .seg button{
    border:0; background:var(--panel-raised); color:var(--text-dim);
    font-size:12px; font-weight:600; padding:8px 12px;
    border-right:1px solid var(--line);
  }
  .seg button:last-child{ border-right:0; }
  .seg button.active{ background:var(--live); color:#0B1410; }

  .msg-preview{
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:#0c0e10;
    padding:26px 18px;
    min-height:120px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  .msg-preview .txt{
    font-family:var(--font-display);
    font-weight:600;
    color:var(--text);
    white-space:pre-wrap;
    line-height:1.3;
  }
  .msg-preview.size-sm .txt{ font-size:16px; }
  .msg-preview.size-md .txt{ font-size:22px; }
  .msg-preview.size-lg .txt{ font-size:30px; }
  .msg-preview.align-left .txt{ text-align:left; }
  .msg-preview.align-center .txt{ text-align:center; }
  .msg-preview .txt:empty::before{
    content:"Nothing published yet";
    color:var(--text-faint); font-family:var(--font-mono); font-weight:400; font-size:13px;
  }

  .footline{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .timestamp{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px);
    background:var(--panel-raised); border:1px solid var(--line);
    color:var(--text); font-size:13px; font-weight:500;
    padding:10px 18px; border-radius:var(--radius);
    opacity:0; transition:opacity .2s ease, transform .2s ease;
    pointer-events:none; z-index:50;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <a href="index.html"><h1>Signage<span>·</span>Console</h1></a>
  </div>
  <div class="status-strip">
    <div class="status-chip"><span class="tally is-standby" id="tally-pdf"></span> CH.01 DOCUMENT</div>
    <div class="status-chip"><span class="tally is-standby" id="tally-msg"></span> CH.02 MESSAGE</div>
  </div>
</div>

<main>

  <!-- ===================== OUTPUT 1 — DOCUMENT ===================== -->
  <section class="panel">
    <div class="panel-head">
      <div class="chan"><span class="num">CH.01</span><h2>Document Output</h2></div>
      <a class="btn btn-ghost" href="display-pdf.html" target="_blank" style="font-size:12px; padding:7px 12px;">Open output ↗</a>
    </div>
    <div class="panel-body">

      <label class="dropzone" id="dropzone" for="pdf-input">
        <strong>Drop a PDF here, or click to choose</strong>
        Replaces whatever is currently on Output 1.
        <input type="file" id="pdf-input" accept="application/pdf">
      </label>

      <div class="file-row empty" id="file-row">
        <div class="icn">PDF</div>
        <div class="meta">
          <div class="name" id="file-name">No document loaded</div>
          <div class="sub" id="file-sub">—</div>
        </div>
      </div>

      <div class="preview-frame" id="preview-frame">
        <div class="preview-empty">Preview appears once a PDF is loaded</div>
      </div>

      <div class="row">
        <button class="btn btn-danger" id="clear-pdf">Clear document</button>
      </div>
    </div>
  </section>

  <!-- ===================== OUTPUT 2 — MESSAGE ===================== -->
  <section class="panel">
    <div class="panel-head">
      <div class="chan"><span class="num">CH.02</span><h2>Message Output</h2></div>
      <a class="btn btn-ghost" href="display-writing.html" target="_blank" style="font-size:12px; padding:7px 12px;">Open output ↗</a>
    </div>
    <div class="panel-body">

      <textarea id="msg-input" placeholder="Write what should appear on the second monitor…"></textarea>

      <div class="controls-row">
        <div class="seg" id="seg-size">
          <button data-size="sm">Small</button>
          <button data-size="md">Medium</button>
          <button data-size="lg" class="active">Large</button>
        </div>
        <div class="seg" id="seg-align">
          <button data-align="left">Left</button>
          <button data-align="center" class="active">Center</button>
        </div>
      </div>

      <div class="msg-preview size-lg align-center" id="msg-preview">
        <div class="txt" id="msg-preview-text"></div>
      </div>

      <div class="footline">
        <span class="timestamp" id="msg-timestamp">Not published yet</span>
        <div class="row" style="flex:none; gap:8px;">
          <button class="btn btn-danger" id="clear-msg">Clear</button>
          <button class="btn btn-primary" id="publish-msg">Publish to Output 2</button>
        </div>
      </div>

    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
