<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Output 1 — Document</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body{ height:100%; background:#0c0e10; overflow:hidden; }
  #stage{ position:fixed; inset:0; }
  #stage iframe{ width:100%; height:100%; border:0; display:block; }

  #empty{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    color:var(--text-faint);
  }
  #empty .tally{ margin-bottom:4px; }
  #empty h1{
    font-family:var(--font-display); font-weight:600; font-size:15px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--text-dim); margin:0;
  }
  #empty p{ margin:0; font-size:12.5px; font-family:var(--font-mono); }

  #hud{
    position:fixed; top:16px; left:16px;
    display:flex; align-items:center; gap:8px;
    background:rgba(20,23,26,.75);
    border:1px solid var(--line);
    border-radius:100px;
    padding:6px 12px 6px 10px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    color:var(--text-dim);
    opacity:1;
    transition:opacity .6s ease;
    backdrop-filter:blur(6px);
    z-index:10;
  }
  #hud.faded{ opacity:0; }

  #fs-btn{
    position:fixed; bottom:16px; right:16px;
    background:rgba(20,23,26,.75);
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:100px;
    padding:8px 14px;
    font-family:var(--font-mono); font-size:11px;
    opacity:1; transition:opacity .6s ease;
    z-index:10;
    backdrop-filter:blur(6px);
  }
  #fs-btn.faded{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

  <div id="hud"><span class="tally is-standby" id="tally"></span> CH.01 DOCUMENT</div>
  <button id="fs-btn">Fullscreen ⤢</button>

  <div id="stage"></div>
  <div id="empty">
    <span class="tally is-standby"></span>
    <h1>Output 1 · Document</h1>
    <p>Waiting for a PDF from the admin console…</p>
  </div>

<script src="js/store.js"></script>
<script src="js/display-pdf.js"></script>
</body>
</html>
