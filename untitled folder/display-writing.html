<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Output 2 — Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body{ height:100%; overflow:hidden; }
  body{
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, rgba(62,213,152,.05), transparent 55%),
      var(--bg);
    padding:8vh 8vw;
  }

  #frame{
    width:100%; max-width:1400px;
    display:flex; flex-direction:column; align-items:center; gap:34px;
  }
  #frame.align-left{ align-items:flex-start; }

  .rule{ width:100%; max-width:640px; opacity:.6; }

  #text{
    font-family:var(--font-display);
    font-weight:600;
    color:var(--text);
    white-space:pre-wrap;
    line-height:1.28;
    letter-spacing:.005em;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
    max-width:100%;
  }
  #text.in{ opacity:1; transform:translateY(0); }
  #frame.align-left #text{ text-align:left; }

  #text.size-sm{ font-size:clamp(24px, 4vw, 44px); }
  #text.size-md{ font-size:clamp(32px, 6vw, 64px); }
  #text.size-lg{ font-size:clamp(40px, 8vw, 92px); }

  #empty-note{
    font-family:var(--font-mono); font-size:13px; color:var(--text-faint);
    letter-spacing:.06em;
  }

  #hud{
    position:fixed; top:16px; left:16px;
    display:flex; align-items:center; gap:8px;
    background:rgba(20,23,26,.75);
    border:1px solid var(--line);
    border-radius:100px;
    padding:6px 12px 6px 10px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.08em;
    color:var(--text-dim);
    transition:opacity .6s ease;
    backdrop-filter:blur(6px);
    z-index:10;
  }
  #hud.faded{ opacity:0; }

  #clock{
    position:fixed; bottom:20px; right:24px;
    font-family:var(--font-mono); font-size:12px; color:var(--text-faint);
    letter-spacing:.06em;
  }

  #fs-btn{
    position:fixed; bottom:16px; left:16px;
    background:rgba(20,23,26,.75);
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:100px;
    padding:8px 14px;
    font-family:var(--font-mono); font-size:11px;
    transition:opacity .6s ease;
    z-index:10;
    backdrop-filter:blur(6px);
  }
  #fs-btn.faded{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div id="hud"><span class="tally is-standby" id="tally"></span> CH.02 MESSAGE</div>
<button id="fs-btn">Fullscreen ⤢</button>

<div id="frame" class="align-center">
  <hr class="hairline rule">
  <div id="text" class="size-lg"></div>
  <div id="empty-note">Waiting for a message from the admin console…</div>
  <hr class="hairline rule">
</div>

<div id="clock"></div>

<script src="js/store.js"></script>
<script src="js/display-writing.js"></script>
</body>
</html>
